<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Happy Girlfriend's Day ❤️</title>
  
  <!-- Google Fonts: Dancing Script for Romantic Headings & Poppins for Body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. CUSTOM PROPERTIES & CSS RESET
       ========================================================================== */
    :root {
      /* Pastel Palette */
      --bg-blush: #FFEAF4;
      --bg-cream: #FFF6FA;
      --bg-lavender: #F3E8FF;
      --accent-pink: #F8AFCB;
      --dark-pink: #D96C98;
      --deep-rose: #B8436E;
      --text-color: #6D4B5A;
      --text-light: #9E7B8C;
      --white: #FFFFFF;
      --paper-bg: #FCF8FA;
      
      /* Envelope Specific Colors */
      --envelope-back: #F7C5D9;
      --envelope-inside: #E8A7C0;
      --envelope-flap: #F5BACF;
      --wax-red: #D94B68;
      --wax-dark: #A82E45;

      /* Shadows & Glassmorphism */
      --shadow-soft: 0 10px 30px rgba(217, 108, 152, 0.15);
      --shadow-deep: 0 20px 40px rgba(109, 75, 90, 0.2);
      --glass-bg: rgba(255, 255, 255, 0.55);
      --glass-border: rgba(255, 255, 255, 0.8);

      /* Typography */
      --font-heading: 'Dancing Script', cursive;
      --font-body: 'Poppins', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-body);
      color: var(--text-color);
      position: relative;
    }

    /* ==========================================================================
       2. BACKGROUND ANIMATION & CANVAS
       ========================================================================== */
    body {
      background: linear-gradient(135deg, var(--bg-blush), var(--bg-cream), var(--bg-lavender), var(--bg-blush));
      background-size: 300% 300%;
      animation: gradientBG 18s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #particles-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* ==========================================================================
       3. MAIN CONTAINER & INTERACTIVE ENVELOPE
       ========================================================================== */
    .app-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    /* Envelope Wrapper */
    .envelope-wrapper {
      position: relative;
      width: clamp(260px, 52vw, 340px);
      height: clamp(180px, 36vw, 230px);
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .envelope-wrapper.floating {
      animation: gentleFloat 3.5s ease-in-out infinite;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    /* Envelope Base Construction */
    .envelope {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: var(--envelope-back);
      border-radius: 12px;
      box-shadow: var(--shadow-deep);
      perspective: 1000px;
    }

    .envelope-inside {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--envelope-inside);
      border-radius: 12px;
      overflow: hidden;
    }

    /* Flaps */
    .flap-left, .flap-right, .flap-bottom {
      position: absolute;
      z-index: 3;
    }

    .flap-left {
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-top: clamp(90px, 18vw, 115px) solid transparent;
      border-bottom: clamp(90px, 18vw, 115px) solid transparent;
      border-left: clamp(130px, 26vw, 170px) solid var(--envelope-flap);
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px;
    }

    .flap-right {
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-top: clamp(90px, 18vw, 115px) solid transparent;
      border-bottom: clamp(90px, 18vw, 115px) solid transparent;
      border-right: clamp(130px, 26vw, 170px) solid var(--envelope-flap);
      border-top-right-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    .flap-bottom {
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: clamp(130px, 26vw, 170px) solid transparent;
      border-right: clamp(130px, 26vw, 170px) solid transparent;
      border-bottom: clamp(100px, 20vw, 125px) solid var(--envelope-back);
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    /* Top Opening Flap */
    .flap-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: clamp(130px, 26vw, 170px) solid transparent;
      border-right: clamp(130px, 26vw, 170px) solid transparent;
      border-top: clamp(105px, 21vw, 130px) solid var(--envelope-flap);
      transform-origin: top center;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 4;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06));
    }

    .envelope-wrapper.open .flap-top {
      transform: rotateX(180deg);
      z-index: 1;
    }

    /* Wax Seal */
    .wax-seal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -20%) scale(1);
      width: clamp(42px, 9vw, 52px);
      height: clamp(42px, 9vw, 52px);
      background: radial-gradient(circle at 30% 30%, var(--wax-red), var(--wax-dark));
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(168, 46, 69, 0.4), inset 0 2px 3px rgba(255, 255, 255, 0.3);
      z-index: 5;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .wax-seal::after {
      content: '❤️';
      font-size: clamp(18px, 4vw, 22px);
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2));
    }

    .envelope-wrapper.open .wax-seal {
      opacity: 0;
      transform: translate(-50%, -20%) scale(0);
      pointer-events: none;
    }

    /* Action Instruction Cue */
    .tap-hint {
      position: absolute;
      bottom: -45px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      font-weight: 500;
      color: var(--dark-pink);
      letter-spacing: 0.5px;
      white-space: nowrap;
      transition: opacity 0.5s ease;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
      pointer-events: none;
    }

    /* Shake Animations */
    .shake-1 {
      animation: gentleShake 0.4s ease-in-out;
    }

    .shake-2 {
      animation: mediumShake 0.5s ease-in-out;
    }

    @keyframes gentleShake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-5deg); }
      40% { transform: rotate(5deg); }
      60% { transform: rotate(-3deg); }
      80% { transform: rotate(3deg); }
    }

    @keyframes mediumShake {
      0%, 100% { transform: rotate(0deg) scale(1.02); }
      15% { transform: rotate(-9deg) scale(1.02); }
      30% { transform: rotate(9deg) scale(1.02); }
      45% { transform: rotate(-6deg) scale(1.02); }
      60% { transform: rotate(6deg) scale(1.02); }
      75% { transform: rotate(-3deg) scale(1.02); }
    }

    /* ==========================================================================
       4. LETTER & STATIONERY DESIGN
       ========================================================================== */
    .letter-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      width: clamp(290px, 88vw, 380px);
      max-height: 85vh;
      opacity: 0;
      pointer-events: none;
      transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
    }

    .letter-container.revealed {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .letter-paper {
      background: var(--paper-bg);
      background-image: radial-gradient(var(--accent-pink) 0.5px, transparent 0.5px);
      background-size: 16px 16px;
      border-radius: 24px;
      padding: clamp(24px, 6vw, 32px) clamp(20px, 5vw, 28px);
      box-shadow: var(--shadow-deep);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow-y: auto;
      max-height: 82vh;
      -webkit-overflow-scrolling: touch;
    }

    .letter-paper::-webkit-scrollbar {
      width: 4px;
    }
    .letter-paper::-webkit-scrollbar-thumb {
      background: var(--accent-pink);
      border-radius: 4px;
    }

    /* Letter Staggered Fade Animations */
    .fade-element {
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .fade-element.in {
      opacity: 1;
      transform: translateY(0);
    }

    .letter-heading {
      font-family: var(--font-heading);
      font-size: clamp(2.2rem, 7vw, 2.8rem);
      color: var(--deep-rose);
      line-height: 1.2;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .letter-message {
      font-size: clamp(1rem, 3.8vw, 1.15rem);
      line-height: 1.6;
      color: var(--text-color);
      font-weight: 400;
      margin-bottom: 12px;
    }

    .letter-sidenote {
      font-size: clamp(0.78rem, 2.8vw, 0.88rem);
      font-style: italic;
      color: var(--text-light);
      opacity: 0.85;
      margin-bottom: 24px;
      font-weight: 300;
      line-height: 1.4;
    }

    /* Photo Frame Display */
    .photo-card {
      width: 85%;
      aspect-ratio: 4 / 3;
      background: var(--glass-bg);
      border: 4px solid var(--white);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
      margin-top: 8px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(5px);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 12px;
    }

    .photo-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px;
      padding: 2px;
      background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(248,175,203,0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 2;
    }

    /* Background state shift when letter opens */
    .app-container.letter-active .envelope-wrapper {
      transform: translateY(180px) scale(0.85);
      opacity: 0.25;
      filter: blur(2px);
      pointer-events: none;
    }

    .app-container.letter-active .tap-hint {
      opacity: 0;
    }
  </style>
</head>
<body>

  <!-- Background Particle Effects Canvas -->
  <canvas id="particles-canvas"></canvas>

  <main class="app-container" id="appContainer">
    
    <!-- Interactive Envelope Construction -->
    <div class="envelope-wrapper floating" id="envelopeWrapper">
      <div class="envelope">
        <div class="envelope-inside"></div>
        <div class="flap-left"></div>
        <div class="flap-right"></div>
        <div class="flap-bottom"></div>
        <div class="flap-top" id="flapTop"></div>
        <div class="wax-seal" id="waxSeal"></div>
      </div>
      <div class="tap-hint" id="tapHint">Click me ❤️</div>
    </div>

    <!-- Letter Stationery Revealed on Tap 3 -->
    <section class="letter-container" id="letterContainer" aria-live="polite">
      <article class="letter-paper">
        <h1 class="letter-heading fade-element" id="heading">Happy Girlfriend's Day ❤️</h1>
        <p class="letter-message fade-element" id="message">
          Happy Girlfriend's Day to NDGH ki sabseee sundar kanya
        </p>
        <p class="letter-sidenote fade-element" id="sidenote">
          (sukanya ki sabse sundarr kanya sounded way better lol)
        </p>
        <div class="photo-card fade-element" id="photoCard">
          <img src="https://cdn.discordapp.com/attachments/1324345883843887115/1532754738288918781/1000083713.jpg?ex=6a6e0096&is=6a6caf16&hm=2a357519d4e53c59521ecdd3ab7ae07cd9a5bf92d811a65e876c673efd88b27e" alt="Sundar Kanya" />
        </div>
      </article>
    </section>

  </main>

  <script>
    /**
     * GIRLFRIEND'S DAY INTERACTIVE EXPERIENCE
     * Clean Vanilla JS implementation focusing on smooth timing & mobile ergonomics.
     */
    document.addEventListener('DOMContentLoaded', () => {
      // DOM Elements
      const appContainer = document.getElementById('appContainer');
      const envelopeWrapper = document.getElementById('envelopeWrapper');
      const tapHint = document.getElementById('tapHint');
      const letterContainer = document.getElementById('letterContainer');
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');

      // Staggered Text Reveal Elements
      const fadeHeading = document.getElementById('heading');
      const fadeMessage = document.getElementById('message');
      const fadeSidenote = document.getElementById('sidenote');
      const fadePhotoCard = document.getElementById('photoCard');

      // Tap Interaction Tracker
      let tapCount = 0;
      let isAnimating = false;

      /* ==========================================================================
         1. CANVAS FLOATING HEARTS & SPARKLES ENGINE
         ========================================================================== */
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = [];
      const particleCount = 20; // Sparse and gentle continuous floating elements

      class Particle {
        constructor(isBurst = false, x = width / 2, y = height / 2) {
          this.reset(isBurst, x, y);
        }

        reset(isBurst = false, x = width / 2, y = height / 2) {
          this.x = isBurst ? x : Math.random() * width;
          this.y = isBurst ? y : height + Math.random() * 40;
          this.size = Math.random() * 12 + 8;
          this.speedY = isBurst ? (Math.random() - 0.7) * 5 : -(Math.random() * 0.8 + 0.4);
          this.speedX = isBurst ? (Math.random() - 0.5) * 6 : Math.sin(Math.random() * Math.PI) * 0.5;
          this.opacity = isBurst ? 0.9 : Math.random() * 0.35 + 0.15;
          this.rotation = Math.random() * 360;
          this.rotationSpeed = (Math.random() - 0.5) * 1.5;
          this.isSparkle = Math.random() > 0.7;
          this.isBurst = isBurst;
          this.life = isBurst ? 1.0 : Infinity;
          this.decay = Math.random() * 0.02 + 0.015;
        }

        update() {
          this.y += this.speedY;
          this.x += this.speedX;
          this.rotation += this.rotationSpeed;

          if (this.isBurst) {
            this.life -= this.decay;
            this.opacity = Math.max(0, this.life);
          } else {
            // Natural recycling for continuous floating elements
            if (this.y < -30) {
              this.reset(false);
            }
          }
        }

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate((this.rotation * Math.PI) / 180);
          ctx.globalAlpha = Math.max(0, this.opacity);

          if (this.isSparkle) {
            // Tiny aesthetic sparkles
            ctx.fillStyle = '#F8AFCB';
            ctx.beginPath();
            ctx.arc(0, 0, this.size / 4, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Heart geometry
            ctx.fillStyle = '#D96C98';
            ctx.beginPath();
            const topCurveHeight = this.size * 0.3;
            ctx.moveTo(0, topCurveHeight);
            ctx.bezierCurveTo(0, 0, -this.size / 2, 0, -this.size / 2, topCurveHeight);
            ctx.bezierCurveTo(-this.size / 2, (this.size + topCurveHeight) / 2, 0, this.size, 0, this.size);
            ctx.bezierCurveTo(0, this.size, this.size / 2, (this.size + topCurveHeight) / 2, this.size / 2, topCurveHeight);
            ctx.bezierCurveTo(this.size / 2, 0, 0, 0, 0, topCurveHeight);
            ctx.closePath();
            ctx.fill();
          }

          ctx.restore();
        }
      }

      // Initialize persistent background hearts
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }

      function spawnBurst(x, y, count = 12) {
        for (let i = 0; i < count; i++) {
          particles.push(new Particle(true, x, y));
        }
      }

      function animateParticles() {
        ctx.clearRect(0, 0, width, height);

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.update();
          p.draw();

          // Remove dead burst particles
          if (p.isBurst && p.life <= 0) {
            particles.splice(i, 1);
          }
        }

        requestAnimationFrame(animateParticles);
      }

      animateParticles();

      /* ==========================================================================
         2. ENVELOPE TAP INTERACTION TIMELINE
         ========================================================================== */
      envelopeWrapper.addEventListener('click', (e) => {
        if (isAnimating || tapCount >= 3) return;

        tapCount++;
        const rect = envelopeWrapper.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        if (tapCount === 1) {
          // --- First Tap: Gentle shake & text hint update ---
          isAnimating = true;
          envelopeWrapper.classList.remove('floating');
          envelopeWrapper.classList.add('shake-1');

          tapHint.textContent = "Tap again ❤️";

          setTimeout(() => {
            envelopeWrapper.classList.remove('shake-1');
            envelopeWrapper.classList.add('floating');
            isAnimating = false;
          }, 450);

        } else if (tapCount === 2) {
          // --- Second Tap: Stronger shake + pop tiny burst of hearts ---
          isAnimating = true;
          envelopeWrapper.classList.remove('floating');
          envelopeWrapper.classList.add('shake-2');

          // Burst tiny hearts from center
          spawnBurst(centerX, centerY, 8);

          tapHint.textContent = "One more tap... ✨";

          setTimeout(() => {
            envelopeWrapper.classList.remove('shake-2');
            envelopeWrapper.classList.add('floating');
            isAnimating = false;
          }, 550);

        } else if (tapCount === 3) {
          // --- Third Tap: Wax Seal Breaks, Envelope Opens, Letter Slides Up ---
          isAnimating = true;
          envelopeWrapper.classList.remove('floating');
          
          // Trigger bigger celebration sparkle burst
          spawnBurst(centerX, centerY, 22);

          // Phase A: Break seal and flip flap open
          envelopeWrapper.classList.add('open');
          tapHint.style.opacity = '0';

          setTimeout(() => {
            // Phase B: Shift wrapper background state & bring up letter stationery
            appContainer.classList.add('letter-active');
            letterContainer.classList.add('revealed');

            // Phase C: Staggered Text Reveal Timeline
            setTimeout(() => fadeHeading.classList.add('in'), 400);
            setTimeout(() => fadeMessage.classList.add('in'), 1100);
            setTimeout(() => fadeSidenote.classList.add('in'), 1800);
            setTimeout(() => fadePhotoCard.classList.add('in'), 2500);

          }, 700);
        }
      });
    });
  </script>
</body>
</html>
